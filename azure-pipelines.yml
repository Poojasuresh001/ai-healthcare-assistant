trigger:
  branches:
    include:
      - main

pr:
  branches:
    include:
      - main

variables:
  pythonVersion: "3.12"
  imageRepository: "ai-healthcare-assistant"
  deployEnabled: "false"

stages:
  - stage: Verify
    displayName: Verify project
    jobs:
      - job: PythonChecks
        pool:
          vmImage: ubuntu-latest
        steps:
          - task: UsePythonVersion@0
            inputs:
              versionSpec: "$(pythonVersion)"
          - script: python -m pip install -r requirements.txt
            displayName: Install dependencies
          - script: python scripts/validate_documents.py
            displayName: Validate synthetic documents
          - script: python -m unittest discover -s tests -v
            displayName: Run tests

  - stage: PublishAndDeploy
    displayName: Build, publish and deploy container
    dependsOn: Verify
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'), eq(variables['deployEnabled'], 'true'))
    jobs:
      - job: BuildPushDeploy
        pool:
          vmImage: ubuntu-latest
        steps:
          - task: Docker@2
            displayName: Build and push image to Azure Container Registry
            inputs:
              command: buildAndPush
              repository: $(imageRepository)
              dockerfile: $(Build.SourcesDirectory)/Dockerfile
              containerRegistry: $(ACR_SERVICE_CONNECTION)
              tags: |
                $(Build.BuildId)
          - task: AzureWebAppContainer@1
            displayName: Deploy image to Azure App Service
            inputs:
              azureSubscription: $(AZURE_SERVICE_CONNECTION)
              appName: $(AZURE_WEBAPP_NAME)
              containers: $(ACR_LOGIN_SERVER)/$(imageRepository):$(Build.BuildId)
              appSettings: |
                -WEBSITES_PORT 8000
                -WEBSITES_ENABLE_APP_SERVICE_STORAGE true
                -GOOGLE_API_KEY $(GOOGLE_API_KEY)
                -GEMINI_CHAT_MODEL gemini-3.8-flash
                -CHROMA_DIRECTORY /home/chroma_db
                -DATABASE_PATH /home/data/synthetic_healthcare.sqlite3
